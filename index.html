<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rohrbiege-Assistent</title>
<meta name="description" content="Rohrleitungen im Achsmaß aufmessen, 3D ansehen und mit der Handbiegezange biegen.">
<meta name="theme-color" content="#1d5fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biegen">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button class="update-bar" id="updateBar" hidden></button>
<header class="top">
  <div class="brand">⟆ Rohrbiegen</div>
  <select id="projSel" aria-label="Projekt wählen"></select>
  <button id="pNew" class="hbtn" title="Neues Rohr" aria-label="Neues Rohr">＋</button>
  <button id="undoBtn" class="hbtn" title="Rückgängig (⌘Z)" aria-label="Rückgängig" disabled>↶</button>
  <span class="ver" id="verTag"></span>
  <button id="redoBtn" class="hbtn" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen" disabled>↷</button>
</header>

<div class="layout">
  <main>
    <section class="tab" id="tab-input">

      <canvas id="miniPrev" aria-label="Vorschau des Rohrs – antippen öffnet 3D"></canvas>
      <p class="hint">Je Schenkel Richtung antippen und Achsmaß eingeben (Rohrmitte bis Rohrmitte).</p>
      <div id="legList"></div>
      <button id="addLeg" class="wide">+ Schenkel hinzufügen</button>
      <div class="tpl">
        <span>Vorlagen</span>
        <button data-tpl="w90">90°-Winkel</button>
        <button id="offNew">Versatz / Etage…</button>
        <button data-tpl="u">U-Bogen</button>
        <button data-tpl="d3">3D-Bogen</button>
      </div>
      <div class="card" id="bundleCard"></div>
      <div class="card" id="summary"></div>
    </section>

    <section class="tab" id="tab-room"></section>
    <section class="tab" id="tab-guide"></section>
    <section class="tab" id="tab-tools"></section>
  </main>

  <aside class="tab active" id="tab-view">
    <div class="viewwrap" id="viewwrap">
      <canvas id="cvBg" aria-hidden="true"></canvas>
      <canvas id="cvGL" aria-hidden="true"></canvas>
      <canvas id="cv" aria-label="3D-Ansicht des gebogenen Rohrs"></canvas>
      <div class="viewbtns">
        <button data-view="iso" title="3D drehen">3D</button>
        <button data-view="front" title="Ansicht von vorne">Vorne</button>
        <button data-view="back" title="Ansicht von hinten">Hinten</button>
        <button data-view="top" title="Ansicht von oben">Oben</button>
        <button data-view="bottom" title="Ansicht von unten">Unten</button>
        <button data-view="left" title="Ansicht von links">Links</button>
        <button data-view="right" title="Ansicht von rechts">Rechts</button>
      </div>
      <div class="viewhint" id="viewHint"></div>
      <div class="viewacts">
        <button id="visBtn" aria-label="Anzeige" title="Anzeige">👁</button>
        <button id="endPin" title="Rohrende im Raum festhalten">📌 Ende fest</button><button id="addPipe" title="Weiteres Rohr in dieses Projekt">+ Rohr</button><button id="addPlane" title="Referenzebene anlegen">+ Ebene</button>
        <span class="toolseg labonly"><button data-tool="edit" class="on" title="Rohr bearbeiten">Rohr</button><button data-tool="clamp" title="Schellen setzen und verschieben">Schellen</button><button data-tool="room" title="Grundriss zeichnen, Wände ziehen">Raum</button></span>
        <button id="addLegView" hidden>✎ Maße</button><button id="offLegView" hidden>⤳ Versatz</button>
      </div>
      <div class="popover" id="visPop" hidden>
        <label class="chk"><input type="checkbox" data-vis="dims"> Maße</label>
        <label class="chk"><input type="checkbox" data-vis="axis"> Achslinie</label>
        <label class="chk"><input type="checkbox" data-vis="total"> Gesamtmaße (Versatz A → Ende)</label>
        <label class="chk"><input type="checkbox" data-vis="angles"> Winkelmaße</label>
        <label class="chk"><input type="checkbox" data-vis="marks"> Strich-Markierungen</label>
        <label class="chk"><input type="checkbox" data-vis="grid"> Raster &amp; Schatten</label>
        <label class="chk labonly"><input type="checkbox" data-vis="planes"> Wände, Boden, Decke</label>
        <label class="chk labonly"><input type="checkbox" data-vis="clamps"> Schellen</label>
        <label class="chk"><input type="checkbox" data-vis="colors"> Rohrfarben</label>
        <label class="chk"><input type="checkbox" data-vis="refPlanes"> Referenzebenen</label>
        <label class="chk"><input type="checkbox" data-vis="refDims"> Bezugsmaße</label>
        <label class="chk"><input type="checkbox" data-vis="extAlways"> Fortführ-Pfeile immer zeigen</label>
      </div>
      <div class="toast" id="toast" hidden></div>
      <div class="roombar" id="roomBar" hidden></div>
      <div class="roombar" id="bundleBar" hidden></div>
      <div class="popover planepop" id="planePop" hidden><button data-ax="0" class="ax-x-b">X-Ebene</button><button data-ax="1" class="ax-y-b">Y-Ebene</button><button data-ax="2" class="ax-z-b">Z-Ebene</button></div>
      <div class="legpanel" id="legPanel" hidden>
        <div class="lp-head"><b id="lpTitle">Schenkel</b><button id="lpClose" aria-label="Schließen">Fertig</button></div>
        <div class="row2">
          <label>Achsmaß (mm)<input id="lpLen" inputmode="decimal"></label>
          <label>Richtung in Ansicht<select id="lpDir"></select></label>
        </div>
        <p class="hint" id="lpNote"></p>
        <label id="lpBundleL" class="lpbundle" hidden>Bündel auf diesem Schenkel<select id="lpBundle"></select></label>
        <div class="btnrow"><button id="lpIns">+ Danach einfügen</button><button id="lpOff">⤳ Versatz</button><button id="lpDel" class="danger">Löschen</button></div>
      </div>
      <div class="legend"><span class="lg-mark"></span>Markierung <span class="lg-dim"></span>Achslinie</div>
    </div>
  </aside>
</div>

<nav class="tabbar">
  <button data-tab="view" class="active"><span>◈</span>3D</button>
  <button data-tab="guide"><span>☰</span>Biegen</button>
  <button data-tab="tools"><span>⚙</span>Einstellungen</button>
  <button data-tab="input" class="labonly"><span>✎</span>Rohr</button>
  <button data-tab="room" class="labonly"><span>⌂</span>Raum</button>
</nav>

<div class="modal" id="offDlg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="offTitle">
    <div class="lp-head"><b id="offTitle">Versatz</b><button id="offCancel">Abbrechen</button></div>
    <div class="sheet-body"><div>
    <div class="lbl">Biegewinkel</div>
    <div class="seg" id="offAng">
      <button data-a="15">15°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="60">60°</button><button data-a="90">90°</button>
    </div>
    <div class="row2">
      <label>Versatz (mm)<input id="offV" inputmode="decimal"></label>
      <label>Richtung<select id="offDir"></select></label>
    </div>
    <div class="row2">
      <label><span id="offALbl">Gerade davor (mm)</span><input id="offA" inputmode="decimal"></label>
      <label><span id="offBLbl">Gerade danach (mm)</span><input id="offB" inputmode="decimal"></label>
    </div>
    </div><div>
    <svg class="offsketch" id="offSketch" viewBox="0 0 320 120" aria-hidden="true"></svg>
    <div class="offinfo" id="offInfo"></div>
    <button id="offOk" class="primary" style="width:100%">Übernehmen</button>
    </div></div>
  </div>
</div>

<div class="modal" id="newDlg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="newTitle">
    <div class="lp-head"><b id="newTitle">Neues Rohr</b><button id="newCancel">Abbrechen</button></div>
    <div id="newBody"></div>
    <button id="newOk" class="primary" style="width:100%;margin-top:12px">Rohr anlegen</button>
  </div>
</div>

<script src="version.js"></script>
<script type="module" src="app.js"></script>
<input type="file" id="pImportFile" accept=".json,application/json" hidden>
</body>
</html>
